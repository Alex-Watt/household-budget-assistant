[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "household-budget-bot"
version = "0.1.0"
description = "Sample household budget bot for one Discord channel"
requires-python = ">=3.14"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-runtime.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
markers = ["integration: local AWS emulation or CDK template assertions; no live services"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".build", "cdk.out"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
files = ["src", "infrastructure", "scripts", "app.py"]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
